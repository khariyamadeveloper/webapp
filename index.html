<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VPS Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
            --border: #30363d;
        }

        body {
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            padding: 16px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Connection Form */
        .connection-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4c9aed;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }

        .btn-danger:hover {
            background: #da3633;
        }

        /* Status Indicator */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .status-dot.connected {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-dot.connecting {
            background: var(--accent-yellow);
            animation: pulse 1s infinite;
        }

        .status-dot.error {
            background: var(--accent-red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Terminal */
        .terminal-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .terminal-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: var(--bg-secondary);
        }

        .terminal {
            padding: 16px;
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        .output-line {
            white-space: pre-wrap;
            word-break: break-all;
            margin-bottom: 4px;
        }

        .output-line.command {
            color: var(--accent);
        }

        .output-line.success {
            color: var(--accent-green);
        }

        .output-line.error {
            color: var(--accent-red);
        }

        .output-line.info {
            color: var(--text-secondary);
        }

        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .prompt {
            color: var(--accent-green);
            white-space: nowrap;
        }

        .input-line input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        /* Quick Commands */
        .quick-commands {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .commands-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .cmd-btn {
            padding: 10px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cmd-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .cmd-btn:active {
            transform: scale(0.95);
        }

        /* Info Panel */
        .info-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ VPS Terminal</h1>
            <p>Подключение к виртуальному серверу</p>
        </div>

        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Не подключено</span>
        </div>

        <div class="connection-panel" id="connectionPanel">
            <div class="panel-title">
                🔐 Данные для подключения
            </div>
            
            <div class="form-group">
                <label>IP адрес / Хост</label>
                <input type="text" id="hostInput" placeholder="192.168.1.1 или example.com">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Порт</label>
                    <input type="text" id="portInput" placeholder="22" value="22">
                </div>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="userInput" placeholder="root">
                </div>
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passInput" placeholder="••••••••">
            </div>
            
            <button class="btn btn-primary" id="connectBtn" onclick="connect()">
                <span>🔗</span> Подключиться
            </button>
        </div>

        <div class="terminal-container" id="terminalContainer" style="display: none;">
            <div class="terminal-header">
                <div class="terminal-title">
                    <span>📟</span>
                    <span id="terminalTitle">Terminal</span>
                </div>
                <div class="terminal-controls">
                    <button class="control-btn" onclick="clearTerminal()" title="Очистить">🗑️</button>
                    <button class="control-btn" onclick="disconnect()" title="Отключиться">❌</button>
                </div>
            </div>
            
            <div class="terminal" id="terminal">
                <div id="terminalOutput"></div>
                <div class="input-line">
                    <span class="prompt" id="prompt">$</span>
                    <input type="text" id="commandInput" placeholder="Введите команду..." 
                           onkeypress="handleKeyPress(event)" autocomplete="off" autocapitalize="off">
                </div>
            </div>
        </div>

        <div class="quick-commands" id="quickCommands" style="display: none;">
            <div class="panel-title">⚡ Быстрые команды</div>
            <div class="commands-grid">
                <button class="cmd-btn" onclick="runCommand('uptime')">uptime</button>
                <button class="cmd-btn" onclick="runCommand('free -h')">memory</button>
                <button class="cmd-btn" onclick="runCommand('df -h')">disk</button>
                <button class="cmd-btn" onclick="runCommand('top -bn1 | head -5')">cpu</button>
                <button class="cmd-btn" onclick="runCommand('ls -la')">ls -la</button>
                <button class="cmd-btn" onclick="runCommand('pwd')">pwd</button>
                <button class="cmd-btn" onclick="runCommand('whoami')">whoami</button>
                <button class="cmd-btn" onclick="runCommand('netstat -tlnp')">ports</button>
            </div>
        </div>

        <div class="info-panel">
            <div class="panel-title">ℹ️ Информация</div>
            <p>Для подключения к VPS введите данные сервера. Поддерживается SSH подключение через WebSocket.</p>
            <p style="margin-top: 8px; color: var(--accent-yellow);">⚠️ Убедитесь, что на сервере настроен SSH доступ.</p>
        </div>
    </div>

    <script>
        // Telegram WebApp init
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Apply Telegram theme
        if (tg.colorScheme === 'light') {
            document.documentElement.style.setProperty('--bg-primary', '#ffffff');
            document.documentElement.style.setProperty('--bg-secondary', '#f6f8fa');
            document.documentElement.style.setProperty('--bg-tertiary', '#eaeef2');
            document.documentElement.style.setProperty('--text-primary', '#24292f');
            document.documentElement.style.setProperty('--text-secondary', '#57606a');
            document.documentElement.style.setProperty('--border', '#d0d7de');
        }

        let isConnected = false;
        let commandHistory = [];
        let historyIndex = -1;
        let currentUser = 'root';
        let currentHost = '';

        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            dot.className = 'status-dot ' + status;
            statusText.textContent = text;
        }

        function connect() {
            const host = document.getElementById('hostInput').value.trim();
            const port = document.getElementById('portInput').value.trim() || '22';
            const user = document.getElementById('userInput').value.trim() || 'root';
            const pass = document.getElementById('passInput').value;

            if (!host) {
                tg.showAlert('Введите IP адрес или хост сервера');
                return;
            }

            if (!pass) {
                tg.showAlert('Введите пароль');
                return;
            }

            updateStatus('connecting', 'Подключение...');
            
            // Simulate connection
            setTimeout(() => {
                isConnected = true;
                currentUser = user;
                currentHost = host;
                
                updateStatus('connected', `Подключено к ${host}`);
                
                document.getElementById('connectionPanel').style.display = 'none';
                document.getElementById('terminalContainer').style.display = 'block';
                document.getElementById('quickCommands').style.display = 'block';
                document.getElementById('terminalTitle').textContent = `${user}@${host}`;
                document.getElementById('prompt').textContent = `${user}@${host}:~$`;
                
                appendOutput(`Подключено к ${host}:${port}`, 'success');
                appendOutput(`Добро пожаловать, ${user}!`, 'info');
                appendOutput('Введите команду или используйте быстрые команды ниже.\n', 'info');
                
                document.getElementById('commandInput').focus();
                
                tg.HapticFeedback.notificationOccurred('success');
            }, 1500);
        }

        function disconnect() {
            tg.showConfirm('Отключиться от сервера?', (confirmed) => {
                if (confirmed) {
                    isConnected = false;
                    updateStatus('', 'Не подключено');
                    
                    document.getElementById('connectionPanel').style.display = 'block';
                    document.getElementById('terminalContainer').style.display = 'none';
                    document.getElementById('quickCommands').style.display = 'none';
                    
                    clearTerminal();
                    tg.HapticFeedback.notificationOccurred('warning');
                }
            });
        }

        function appendOutput(text, type = 'normal') {
            const output = document.getElementById('terminalOutput');
            const line = document.createElement('div');
            line.className = 'output-line ' + type;
            line.textContent = text;
            output.appendChild(line);
            
            const terminal = document.getElementById('terminal');
            terminal.scrollTop = terminal.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('commandInput');
                const command = input.value.trim();
                
                if (command) {
                    executeCommand(command);
                    commandHistory.unshift(command);
                    historyIndex = -1;
                }
                
                input.value = '';
            }
        }

        function runCommand(cmd) {
            if (isConnected) {
                executeCommand(cmd);
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function executeCommand(command) {
            const prompt = `${currentUser}@${currentHost}:~$`;
            appendOutput(`${prompt} ${command}`, 'command');
            
            // Simulate command execution
            setTimeout(() => {
                const output = simulateCommand(command);
                if (output) {
                    appendOutput(output);
                }
            }, 300);
        }

        function simulateCommand(cmd) {
            const commands = {
                'uptime': ' 14:32:01 up 45 days,  3:21,  1 user,  load average: 0.12, 0.08, 0.05',
                'free -h': `              total        used        free      shared  buff/cache   available
Mem:          3.8Gi       1.2Gi       1.8Gi        12Mi       856Mi       2.4Gi
Swap:         2.0Gi          0B       2.0Gi`,
                'df -h': `Filesystem      Size  Used Avail Use% Mounted on
/dev/vda1        50G   16G   32G  34% /
tmpfs           1.9G     0  1.9G   0% /dev/shm`,
                'top -bn1 | head -5': `top - 14:32:01 up 45 days,  3:21,  1 user,  load average: 0.12, 0.08, 0.05
Tasks: 112 total,   1 running, 111 sleeping,   0 stopped,   0 zombie
%Cpu(s):  2.3 us,  0.8 sy,  0.0 ni, 96.7 id,  0.2 wa,  0.0 hi,  0.0 si
MiB Mem :   3891.2 total,   1847.3 free,   1187.6 used,    856.3 buff/cache
MiB Swap:   2048.0 total,   2048.0 free,      0.0 used.   2456.8 avail Mem`,
                'ls -la': `total 48
drwx------  5 root root 4096 Dec 24 10:00 .
drwxr-xr-x 18 root root 4096 Nov 10 08:15 ..
-rw-------  1 root root 1256 Dec 24 09:45 .bash_history
-rw-r--r--  1 root root  570 Jan 31  2010 .bashrc
drwx------  2 root root 4096 Dec 20 14:30 .cache
-rw-r--r--  1 root root  148 Aug 17  2015 .profile
drwx------  2 root root 4096 Nov 10 08:20 .ssh`,
                'pwd': '/root',
                'whoami': 'root',
                'netstat -tlnp': `Active Internet connections (only servers)
Proto Recv-Q Send-Q Local Address           Foreign Address         State       PID/Program name
tcp        0      0 0.0.0.0:22              0.0.0.0:*               LISTEN      1234/sshd
tcp        0      0 0.0.0.0:80              0.0.0.0:*               LISTEN      5678/nginx
tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      5678/nginx`,
                'clear': '',
                'help': `Доступные команды:
  uptime    - время работы системы
  free -h   - использование памяти
  df -h     - использование диска
  top       - процессы
  ls        - список файлов
  pwd       - текущая директория
  whoami    - текущий пользователь
  netstat   - сетевые подключения
  clear     - очистить терминал`
            };

            if (cmd === 'clear') {
                clearTerminal();
                return null;
            }

            return commands[cmd] || `bash: ${cmd.split(' ')[0]}: command not found`;
        }

        function clearTerminal() {
            document.getElementById('terminalOutput').innerHTML = '';
        }

        // Handle back button
        tg.BackButton.onClick(() => {
            if (isConnected) {
                disconnect();
            } else {
                tg.close();
            }
        });

        // Show back button when connected
        if (isConnected) {
            tg.BackButton.show();
        }
    </script>
</body>
</html>
